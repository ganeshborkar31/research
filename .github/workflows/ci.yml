name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality-gates:
    name: Quality And Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pip-audit

      - name: Validate dependency graph
        run: pip check

      - name: Syntax sanity check
        run: python -m compileall -q app tests workers

      - name: Dependency vulnerability scan
        run: pip-audit --progress-spinner=off

  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ASYNC_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/test
      SYNC_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit/API tests
        run: pytest -q --maxfail=1 --durations=10 --junitxml=pytest-fast.xml

      - name: Upload fast test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-${{ matrix.python-version }}
          path: pytest-fast.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality-gates, fast-tests]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Docker diagnostics
        run: |
          docker version
          docker info

      - name: Run integration tests (Postgres, Redis, Qdrant)
        run: pytest -q -m integration tests/integration --maxfail=1 --durations=10 --junitxml=pytest-integration.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration
          path: pytest-integration.xml
