[project]
name = "knowledge-ai"
version = "0.1.0"
description = "Enterprise RAG + research ingestion platform"
requires-python = ">=3.10"

dependencies = [
  # Core API
  "fastapi",
  "httpx",
  "uvicorn",
  "debugpy",
  "python-multipart",     # form parsing (OAuth2 login form, multipart uploads)
  # AI / RAG
  "langchain",
  "langgraph",
  "langchain-openai",
  "google-genai",         # gemini sdk
  "qdrant-client",
  # Config
  "python-dotenv",
  "pydantic-settings",
  "PyJWT",
  # Observability
  "prometheus-client",
  "prometheus-fastapi-instrumentator",
  # Database
  "asyncpg",              # async driver (app)
  "psycopg[binary]",      # sync driver (alembic)
  "alembic",
  # Messaging / Cache
  "aio-pika",
  "redis",
  "pydantic[email]>=2.12.5",
]

# ---------------------------------------
# Test Dependencies (NOT installed in prod)
# ---------------------------------------
[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "websockets",
  "testcontainers[postgresql,redis]",

]
