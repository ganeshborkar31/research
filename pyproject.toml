[project]
name = "knowledge-ai"
version = "0.1.0"
description = "Enterprise RAG + research ingestion platform"
requires-python = ">=3.10"

dependencies = [
  # Core API
  "fastapi",
  "uvicorn",

  # AI / RAG
  "langchain",
  "langchain-openai",
  "qdrant-client",

  # Config
  "python-dotenv",
  "pydantic-settings",

  # Observability
  "prometheus-client",
  "prometheus-fastapi-instrumentator",

  # Database
  "asyncpg",              # async driver (app)
  "psycopg[binary]",      # sync driver (alembic)
  "alembic",

  # Messaging / Cache
  "aio-pika",
  "redis",
]

# ---------------------------------------
# Test Dependencies (NOT installed in prod)
# ---------------------------------------
[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "testcontainers[postgresql]",

]



